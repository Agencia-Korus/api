name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  JWT_SECRET_KEY: ci-jwt-secret
  JWT_ALGORITHM: HS256
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
  DEBUG: 'false'
  CORS_ALLOW_ORIGINS: '*'
  TESTCONTAINERS_RYUK_DISABLED: 'true'

jobs:
  lint-and-test:
    name: Lint + Test (api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Check Docker
        run: docker version

      - name: Run lint
        run: poetry run ruff check

      - name: Run tests
        run: >
          poetry run pytest
          --cov=core
          --cov=db
          --cov=modules
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=100
          -q

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: coverage.xml

  docker-build:
    name: Docker build (api)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: korus-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
