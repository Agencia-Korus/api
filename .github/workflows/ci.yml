name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  POETRY_VERSION: '2.4.1'
  POSTGRES_USER: korus
  POSTGRES_PASSWORD: korus
  POSTGRES_DB: korus_test
  DATABASE_URL: postgresql+asyncpg://korus:korus@localhost:5432/korus_test
  JWT_SECRET_KEY: ci-jwt-secret
  JWT_ALGORITHM: HS256
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
  DEBUG: 'false'
  CORS_ALLOW_ORIGINS: '*'

jobs:
  lint-and-test:
    name: Lint + Test (api)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: korus
          POSTGRES_PASSWORD: korus
          POSTGRES_DB: korus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U korus -d korus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Poetry
        run: pipx install poetry==${POETRY_VERSION}

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --no-root

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Run database migrations
        run: poetry run alembic upgrade head

      - name: Run tests
        run: poetry run pytest -x --cov --cov-report=xml -vv

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: coverage.xml

  docker-build:
    name: Docker build (api)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v6

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: korus-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
