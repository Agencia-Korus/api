[project]
name = "api"
version = "0.1.0"
description = "API principal do projeto Korus"
authors = [
    {name = "lcsgborges",email = "lcsgborges@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.135.3,<0.136.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "python-jose[cryptography] (>=3.3.0,<4.0.0)",
    "bcrypt (>=4.0.1,<5.1)",
    "email-validator (>=2.2.0,<3.0.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = { version = ">=0.135.3,<0.136.0", extras = ["standard"] }
sqlalchemy = ">=2.0.49,<3.0.0"
pydantic-settings = ">=2.14.0,<3.0.0"
asyncpg = ">=0.31.0,<0.32.0"
alembic = ">=1.18.4,<2.0.0"
python-jose = { version = ">=3.3.0,<4.0.0", extras = ["cryptography"] }
bcrypt = ">=4.0.1,<5.1"
email-validator = ">=2.2.0,<3.0.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.9,<0.16.0"
pytest = ">=9.0.2,<10.0.0"
pytest-cov = ">=7.1.0,<8.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"
httpx = ">=0.28.1,<0.29.0"
taskipy = ">=1.14.1,<2.0.0"
greenlet = ">=3.3.2,<4.0.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.9,<0.16.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "greenlet (>=3.3.2,<4.0.0)",
]

[tool.ruff]
line-length = 88
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']
ignore = ['W191', 'PLR0913', 'PLR2004', 'PLR0917']

[tool.ruff.format]
preview = true
quote-style = 'single'
indent-style = 'tab'

[tool.pytest.ini_options]
pythonpath = ['api']
addopts = '-p no:warnings'
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'

[tool.coverage.run]
concurrency= ['thread', 'greenlet']

[tool.taskipy.tasks]
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
run = 'uvicorn main:app --app-dir api --host 127.0.0.1 --port 8000 --reload'
migrate = 'alembic upgrade head'
makemigration = 'alembic revision --autogenerate -m'
pre_test = 'task lint'
test = 'pytest -x --cov=core --cov=db --cov=modules -vv'
post_test = 'coverage html'
